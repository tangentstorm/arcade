# Builds the Web export and publishes it to the gh-pages branch (GitHub Pages source).
# Runs on push to main and on manual dispatch.
name: Build Web & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -eux
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip && mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$TPL/"
          godot --version

      - name: Smoke test
        run: GODOT=godot ./tools/smoke_headless.sh

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          # Social preview image referenced by og:image / twitter:image in head_include.
          cp arcade/branding/og-image.png build/web/og-image.png
          touch build/web/.nojekyll

      # Pages is served from the gh-pages branch (build_type=legacy).
      - name: Publish build/web to gh-pages
        run: |
          set -eux
          cd build/web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
